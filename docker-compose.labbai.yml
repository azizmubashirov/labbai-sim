# Labbai test stack (147.93.62.159). Ports bound to 127.0.0.1 only — reach via SSH tunnel.
# Images are built by .github/workflows/build-images.yml and pulled from GHCR.
name: labbai
services:
  simstudio:
    image: ghcr.io/azizmubashirov/labbai-sim-simstudio:${LABBAI_TAG:-latest}
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    env_file: .env
    restart: unless-stopped
    ports: ['127.0.0.1:3300:3000']
    # Local file storage (no S3 configured); host dir must be owned by uid 1001.
    volumes: ['/root/labbai/uploads:/app/apps/sim/uploads']
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/simstudio
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL}
      - REDIS_URL=redis://redis:6379
      - SOCKET_SERVER_URL=http://realtime:3002
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      realtime: {condition: service_started}
      uploads-init: {condition: service_completed_successfully}
    deploy: {resources: {limits: {memory: 3G}}}

  # Local storage expects these roots to exist and be owned by the app user (uid 1001).
  uploads-init:
    image: alpine:3.21
    command: ['sh', '-c', 'mkdir -p /uploads/.staging /uploads/.multipart && chown -R 1001:1001 /uploads']
    volumes: ['/root/labbai/uploads:/uploads']
    restart: 'no'

  # Scheduled workflows, polling triggers, resume polling, outbox, KB connector sync.
  cron:
    image: ghcr.io/azizmubashirov/labbai-sim-cron:${LABBAI_TAG:-latest}
    restart: on-failure
    environment:
      - SIM_URL=http://simstudio:3000
      - CRON_SECRET=${CRON_SECRET}
      - TZ=Asia/Tashkent
    depends_on:
      simstudio: {condition: service_started}

  realtime:
    image: ghcr.io/azizmubashirov/labbai-sim-realtime:${LABBAI_TAG:-latest}
    build: {context: ., dockerfile: docker/realtime.Dockerfile}
    env_file: .env
    restart: unless-stopped
    ports: ['127.0.0.1:3302:3002']
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/simstudio
      - BETTER_AUTH_URL=${NEXT_PUBLIC_APP_URL}
      - REDIS_URL=redis://redis:6379
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    deploy: {resources: {limits: {memory: 512M}}}

  # One-shot: drizzle journal migrations (includes 0380_labbai_local_copilot).
  migrations:
    image: ghcr.io/azizmubashirov/labbai-sim-migrations:${LABBAI_TAG:-latest}
    build: {context: ., dockerfile: docker/db.Dockerfile}
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/simstudio
    depends_on:
      db: {condition: service_healthy}
    command: ['bun', 'run', 'db:migrate']
    restart: 'no'
    profiles: ['setup']

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck: {test: ['CMD', 'redis-cli', 'ping'], interval: 5s, timeout: 5s, retries: 5}

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=simstudio
    volumes: ['labbai_pg_v2:/var/lib/postgresql/data']
    healthcheck: {test: ['CMD-SHELL', 'pg_isready -U postgres'], interval: 5s, timeout: 5s, retries: 5}

volumes:
  labbai_pg_v2:
