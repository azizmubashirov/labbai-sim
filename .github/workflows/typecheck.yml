name: Type check

# Fast feedback (~10 min) before the long image build: tsc over the app and the
# local copilot unit tests.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (apps/sim)
        id: tsc
        working-directory: apps/sim
        run: |
          set -o pipefail
          NODE_OPTIONS=--max-old-space-size=12288 bunx tsc --noEmit --pretty false 2>&1 | tee /tmp/typecheck.txt

      - name: Local copilot unit tests
        id: tests
        if: always()
        working-directory: apps/sim
        run: |
          set -o pipefail
          bunx vitest run local-copilot lib/api-key lib/mothership/inbox --reporter=dot 2>&1 | tee /tmp/tests.txt

      # Job logs need repo-admin auth to download; publish the results on a public
      # branch so they can be read from raw.githubusercontent.com.
      - name: Publish report
        if: always()
        run: |
          mkdir -p /tmp/report && cd /tmp/report
          git init -q && git checkout -q -b ci-reports
          cp /tmp/typecheck.txt typecheck.txt 2>/dev/null || echo "no output" > typecheck.txt
          tail -c 200000 /tmp/tests.txt > tests.txt 2>/dev/null || echo "no output" > tests.txt
          printf 'sha=%s\ntsc=%s\ntests=%s\n' "$GITHUB_SHA" "${{ steps.tsc.outcome }}" "${{ steps.tests.outcome }}" > status.txt
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "report $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-reports

  # Same `next build` the app image runs, outside Docker so its output can be published.
  next-build:
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo swapoff -a || true
          sudo fallocate -l 24G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Next build (apps/sim)
        id: build
        working-directory: apps/sim
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/dummy
          NEXT_PUBLIC_APP_URL: http://localhost:3300
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set -o pipefail
          bun run build 2>&1 | tee /tmp/build.txt

      - name: Publish build report
        if: always()
        run: |
          mkdir -p /tmp/breport && cd /tmp/breport
          git init -q && git checkout -q -b ci-build-report
          tail -c 400000 /tmp/build.txt > build.txt 2>/dev/null || echo "no output" > build.txt
          printf 'sha=%s\nbuild=%s\n' "$GITHUB_SHA" "${{ steps.build.outcome }}" > status.txt
          git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm "build report $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-build-report
