name: Type check

# Fast feedback (~10 min) before the long image build: tsc over the app and the
# local copilot unit tests.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check (apps/sim)
        working-directory: apps/sim
        run: NODE_OPTIONS=--max-old-space-size=12288 bunx tsc --noEmit

      - name: Local copilot unit tests
        if: always()
        working-directory: apps/sim
        run: bunx vitest run local-copilot lib/api-key --reporter=dot
